<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Donut Chat</title>
<style>
:root{--bg:#111214;--card:#1b1d22;--line:#2c3038;--ink:#f4efe6;--soft:#a8a194;--accent:#e0a24a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{color:var(--accent)}header button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#log{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 14px;max-width:92%;white-space:pre-wrap}
.msg.user{margin-left:auto;background:#2a2418;border-radius:16px 16px 4px 16px;padding:10px 12px}
.msg.bot{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit}
form button{border:0;border-radius:14px;background:var(--accent);color:#1a1208;font-weight:700;padding:0 16px}
.hint{color:var(--soft);font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:13px}
#mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
#panel{display:none;position:fixed;left:0;right:0;bottom:0;max-height:90dvh;overflow:auto;background:var(--card);z-index:21;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
#panel input,#panel select{width:100%;margin:6px 0 10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
#panel .row{display:flex;gap:8px;flex-wrap:wrap}
#panel button{border:0;border-radius:12px;padding:10px 12px;background:var(--accent);color:#1a1208;font-weight:700}
#panel button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#stats{font-size:13px;color:var(--soft);white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:12px}
</style></head>
<body>
<div class="app">
<header><div><b>Donut Chat</b><div class="hint" id="modeHint"></div></div><button type="button" id="devBtn">Dev</button></header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="Ask about Minecraft or DonutSMP"></textarea><button type="submit">Send</button></form>
</div>
<div id="mask"></div>
<div id="panel">
<h2>Dev panel</h2>
<div id="gate"><p class="hint">Password</p><input id="devPass" type="password" /><div class="row"><button type="button" id="unlock">Unlock</button><button type="button" class="ghost" id="close1">Close</button></div><p class="hint" id="gateErr"></p></div>
<div id="tools" style="display:none"><p id="stats"></p>
<p class="hint">Paste a model key so every reply can be newly written. The key stays on this phone.</p>
<select id="prov"><option value="openai">OpenAI</option><option value="openrouter">OpenRouter</option><option value="groq">Groq</option></select>
<input id="apiKey" type="password" placeholder="API key" />
<input id="apiModel" placeholder="Model, like gpt-4o-mini" />
<div class="row"><button type="button" id="saveKey">Save key</button><button type="button" class="ghost" id="clearKey">Remove key</button><button type="button" class="ghost" id="clearChat">Clear chat</button><button type="button" class="ghost" id="close2">Close</button></div>
</div></div>
<script>
const PASS="FERRARI1";
const SYS="You are Donut Chat. Answer the user's actual question first, in natural language. Vary wording each time. Stay accurate. Only discuss Minecraft, DonutSMP, DrDonutt, and Donut Discords. Official IP donutsmp.net. Bedrock port 19132. Official Discord discord.gg/donutsmp. Owner DrDonutt. If unsure, say so. Refuse other topics. Keep it clean. No real-money trading or account theft help.";
const FACTS={ip:"donutsmp.net",port:"19132",discord:"discord.gg/donutsmp",owner:"DrDonutt"};
const history=[];
let cfg={provider:"openai",key:"",model:"gpt-4o-mini"};
try{Object.assign(cfg,JSON.parse(localStorage.getItem("donut-cfg")||"{}"))}catch(e){}
function say(a){return a[Math.floor(Math.random()*a.length)]}
function nrm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9. ]/g," ").replace(/ +/g," ").trim()}
function onTopic(q){const n=nrm(q);if(/^(hi|hey|hello|yo|sup|help)$/.test(n))return true;return /minecraft|mc|donut|smp|discord|java|bedrock|creeper|diamond|nether|end|ip|join|pvp|mob|ore|enchant|shard|money|dragon|warden|elytra|totem|mending|owner|drdonut|port|xbox|ps5|switch|portal/.test(n)}
function localAnswer(q){
  const n=nrm(q);
  if(!onTopic(q))return say(["I only do Minecraft and DonutSMP.","Ask a Donut or Minecraft question instead."]);
  if(/^(hi|hey|hello|yo|sup)$/.test(n))return say(["Hey. What do you want to know?","Yo. IP, Discord, diamonds, nether — go."]);
  if(/ip|address/.test(n)&&!/discord/.test(n))return say(["DonutSMP IP is "+FACTS.ip+".","Use "+FACTS.ip+" as the server address."]);
  if(/(bedrock|xbox|ps5|switch|phone|port)/.test(n)&&/(join|port|bedrock|xbox|phone)/.test(n))return say(["Bedrock and consoles: "+FACTS.ip+" port "+FACTS.port+".","Port "+FACTS.port+", address "+FACTS.ip+"."]);
  if(/join/.test(n))return say(["Java add "+FACTS.ip+". Bedrock uses the same address with port "+FACTS.port+".","To join, add "+FACTS.ip+". On Bedrock set port "+FACTS.port+"."]);
  if(/discord/.test(n))return say(["Official Discord is "+FACTS.discord+".","Use "+FACTS.discord+". Other Donut Discords are unofficial unless that one links them."]);
  if(/owner|who made|who owns|drdonut/.test(n))return say([FACTS.owner+" owns DonutSMP.","The owner is "+FACTS.owner+"."]);
  if(/shard/.test(n))return say(["Shards are Donut extra currency for the shard shop. Money is everyday cash.","Shards buy premium shop items. Normal trades use money."]);
  if(/money|auction|ah/.test(n))return say(["Money is the main Donut currency from selling loot and auctions.","Earn money by selling items and using the auction house."]);
  if(/diamond/.test(n))return say(["Mine diamonds around Y=-58 in deepslate and bring water.","Best diamond layer is near Y=-58."]);
  if(/nether portal|go to the nether|how.*nether/.test(n))return say(["Build a 4 by 5 obsidian frame and light it.","Four wide, five tall, flint and steel."]);
  if(/elytra/.test(n))return say(["Beat the dragon, take a gateway, loot an End city ship.","Elytra are on End city ships after the dragon fight."]);
  if(/dragon/.test(n))return say(["Eyes of Ender find the stronghold. Break crystals, then the dragon.","Crystals first, dragon second."]);
  if(/creeper/.test(n))return say(["Creepers explode if they reach you. Hit and back up.","Do not let a creeper hug your base."]);
  if(/mending/.test(n))return say(["Mending repairs the item with XP you pick up.","XP you collect fixes Mending gear."]);
  if(/totem/.test(n))return say(["Hold a Totem of Undying to survive one death.","Totem in hand equals one save."]);
  if(/team/.test(n))return "Teams were removed from DonutSMP on June 2, 2026.";
  if(/duel/.test(n))return "Duels were removed from DonutSMP.";
  return say(["Ask it more specifically. I can do join info, currencies, or vanilla mechanics. For brand-new wording every time, add a model key in Dev.","I can talk, but a live key in Dev is what makes each answer newly written."]);
}
function endpoints(){
  if(cfg.provider==="openrouter")return{url:"https://openrouter.ai/api/v1/chat/completions",model:cfg.model||"openai/gpt-4o-mini"};
  if(cfg.provider==="groq")return{url:"https://api.groq.com/openai/v1/chat/completions",model:cfg.model||"llama-3.1-8b-instant"};
  return{url:"https://api.openai.com/v1/chat/completions",model:cfg.model||"gpt-4o-mini"};
}
async function liveAnswer(q,node){
  const info=endpoints();
  const messages=[{role:"system",content:SYS}].concat(history.slice(-8)).concat([{role:"user",content:q}]);
  const res=await fetch(info.url,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+cfg.key},body:JSON.stringify({model:info.model,temperature:0.9,stream:true,messages})});
  if(!res.ok)throw new Error((await res.text()).slice(0,160)||("HTTP "+res.status));
  const reader=res.body.getReader();const dec=new TextDecoder();let buf="",full="";
  while(true){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop()||"";
    for(const line of lines){if(!line.startsWith("data:"))continue;const data=line.slice(5).trim();if(data==="[DONE]")continue;try{const json=JSON.parse(data);const piece=json.choices&&json.choices[0]&&json.choices[0].delta&&json.choices[0].delta.content;if(piece){full+=piece;node.textContent=full}}catch(e){}}}
  if(!full)throw new Error("Empty model reply");return full;
}
const log=document.getElementById("log");
function add(role,text){const el=document.createElement("div");el.className="msg "+role;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight;return el}
function setMode(){document.getElementById("modeHint").textContent=cfg.key?"Live model on":"Offline voice — add a key in Dev for new wording every time"}
setMode();
add("bot",cfg.key?"Live answers are on.":"I will answer in my own words. For ChatGPT-style new replies each time, open Dev and paste a model key.");
const chips=document.createElement("div");chips.className="chips";
["What is the IP?","How do shards work?","How do I get elytra?","Is Donut Java and Bedrock?"].forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>send(t);chips.appendChild(b)});
log.appendChild(chips);
let busy=false;
async function send(text){
  const q=(text||document.getElementById("q").value).trim();if(!q||busy)return;
  document.getElementById("q").value="";add("user",q);const node=add("bot",cfg.key?"Thinking…":"");busy=true;
  try{let out=cfg.key?await liveAnswer(q,node):localAnswer(q);node.textContent=out;history.push({role:"user",content:q},{role:"assistant",content:out})}
  catch(err){node.textContent="Live model failed. "+err.message+"\n\n"+localAnswer(q)}
  finally{busy=false}
}
document.getElementById("f").onsubmit=e=>{e.preventDefault();send()};
const mask=document.getElementById("mask"),panel=document.getElementById("panel");
function openDev(){mask.style.display="block";panel.style.display="block"}
function closeDev(){mask.style.display="none";panel.style.display="none"}
document.getElementById("devBtn").onclick=openDev;
document.getElementById("close1").onclick=closeDev;
document.getElementById("close2").onclick=closeDev;
mask.onclick=closeDev;
function refreshStats(){document.getElementById("stats").textContent=cfg.key?"Live model ready ("+cfg.provider+")":"No live key"}
function unlock(){if(document.getElementById("devPass").value!==PASS){document.getElementById("gateErr").textContent="Wrong password.";return}document.getElementById("gate").style.display="none";document.getElementById("tools").style.display="block";sessionStorage.setItem("donut-dev","1");document.getElementById("prov").value=cfg.provider;document.getElementById("apiKey").value=cfg.key;document.getElementById("apiModel").value=cfg.model;refreshStats()}
document.getElementById("unlock").onclick=unlock;
document.getElementById("devPass").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
if(sessionStorage.getItem("donut-dev")==="1"){document.getElementById("gate").style.display="none";document.getElementById("tools").style.display="block";document.getElementById("prov").value=cfg.provider;document.getElementById("apiKey").value=cfg.key;document.getElementById("apiModel").value=cfg.model;refreshStats()}
document.getElementById("saveKey").onclick=()=>{cfg.provider=document.getElementById("prov").value;cfg.key=document.getElementById("apiKey").value.trim();cfg.model=document.getElementById("apiModel").value.trim()||cfg.model;localStorage.setItem("donut-cfg",JSON.stringify(cfg));setMode();refreshStats()};
document.getElementById("clearKey").onclick=()=>{cfg.key="";localStorage.setItem("donut-cfg",JSON.stringify(cfg));document.getElementById("apiKey").value="";setMode();refreshStats()};
document.getElementById("clearChat").onclick=()=>{log.innerHTML="";history.length=0;add("bot","Chat cleared.")};
</script></body></html>
