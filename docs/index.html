<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Mine Atlas</title>
<style>
:root{--bg:#0b0e14;--panel:#141923;--ink:#f4efe4;--muted:#9aa3b2;--line:#242b38;--gold:#e2b15a;--moss:#7dce9a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(1200px 500px at 10% -10%,#1a2438 0%,transparent 50%),var(--bg);color:var(--ink);font:16px/1.45 ui-sans-serif,system-ui,-apple-system,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
.top{padding:12px 14px 8px;padding-top:calc(12px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(160deg,#3d2a12,#e2b15a 55%,#fff3c4);display:grid;place-items:center;font-weight:900;color:#2a1a08}
h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:12px}
.nav{display:flex;gap:6px;overflow:auto;padding:8px 14px 10px;scrollbar-width:none}
.nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:650}
.nav button.on{background:var(--gold);color:#24180a;border-color:transparent}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
.scroll{flex:1;overflow:auto;padding:0 14px 18px}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#0f131c;color:var(--ink);font:inherit;margin:0 0 12px}
.hero,.card{background:linear-gradient(180deg,#1a2030,#141923);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 10px}
.item{display:flex;gap:10px;align-items:center}
.slot{width:48px;height:48px;border-radius:10px;background:linear-gradient(#2a3142,#161b26);border:2px solid #3b4458;display:grid;place-items:center;flex:0 0 48px}
.slot img{width:36px;height:36px;image-rendering:pixelated}
.tag{display:inline-block;background:#0f131c;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted);margin:2px 4px 0 0}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed #232a38}
.stat b{color:var(--gold)}
#log{flex:1;overflow:auto;padding:8px 14px}
.msg{margin:0 0 10px;max-width:92%;padding:11px 13px;border-radius:16px;white-space:pre-wrap}
.user{margin-left:auto;background:#2a2418;border:1px solid #4a3b1f}
.bot{background:var(--panel);border:1px solid var(--line)}
.bar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#10141c}
textarea{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:#0f131c;color:var(--ink);padding:10px;font:inherit;resize:none}
.bar button,.go{border:0;border-radius:14px;background:var(--gold);color:#24180a;font-weight:800;padding:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:#10151f;color:var(--ink);border-radius:10px;padding:7px 10px}
.chips button.on{background:var(--moss);color:#062014;border-color:transparent}
select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0f131c;color:var(--ink);font:inherit;margin:0 0 8px}
.big{font-size:28px;font-weight:800;color:var(--gold)}
.hint{color:var(--muted);font-size:13px}
</style></head>
<body>
<div class="app">
  <div class="top"><div class="brand"><div class="logo">M</div><div><h1>Mine Atlas</h1><div class="sub" id="st">Minecraft field guide</div></div></div></div>
  <div class="nav" id="nav"></div>
  <div class="pane on" id="chat"><div id="log"></div><form class="bar" id="f"><textarea id="q" placeholder="Ask anything Minecraft"></textarea><button>Send</button></form></div>
  <div class="pane" id="forge"><div class="scroll" id="forgeBox"></div></div>
  <div class="pane" id="mobs"><div class="scroll"><input class="search" id="ms" placeholder="Search mobs"/><div id="mlist"></div></div></div>
  <div class="pane" id="world"><div class="scroll"><input class="search" id="ws" placeholder="Search biomes and loot"/><div id="wlist"></div></div></div>
  <div class="pane" id="brew"><div class="scroll"><input class="search" id="ps" placeholder="Search potions"/><div id="plist"></div></div></div>
  <div class="pane" id="index"><div class="scroll"><input class="search" id="xs" placeholder="Search the whole atlas"/><div id="xlist"></div></div></div>
</div>
<script src="app.js"></script>
</body></html>
