<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Donut Chat</title>
<style>
:root{--bg:#111214;--card:#1b1d22;--line:#2c3038;--ink:#f4efe6;--soft:#a8a194;--accent:#e0a24a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header b{color:var(--accent)}header button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#log{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 14px;max-width:92%;white-space:pre-wrap}
.msg.user{margin-left:auto;background:#2a2418;border-radius:16px 16px 4px 16px;padding:10px 12px}
.msg.bot{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 12px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit}
form button{border:0;border-radius:14px;background:var(--accent);color:#1a1208;font-weight:700;padding:0 16px}
.hint{color:var(--soft);font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:13px}
#mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
#panel{display:none;position:fixed;inset:auto 0 0 0;max-height:88dvh;overflow:auto;background:var(--card);border-top:1px solid var(--line);z-index:21;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
#panel input,#panel textarea{width:100%;margin:6px 0 10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
#panel .row{display:flex;gap:8px;flex-wrap:wrap}
#panel button{border:0;border-radius:12px;padding:10px 12px;background:var(--accent);color:#1a1208;font-weight:700}
#panel button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
#stats{font-size:13px;color:var(--soft);white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:12px}
</style></head>
<body>
<div class="app">
<header><div><b>Donut Chat</b><div class="hint">Direct answers. Minecraft + Donut only.</div></div><button type="button" id="devBtn">Dev</button></header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="Ask a real question"></textarea><button type="submit">Send</button></form>
</div>
<div id="mask"></div>
<div id="panel">
<h2>Dev panel</h2>
<div id="gate"><p class="hint">Password</p><input id="devPass" type="password" placeholder="Enter password" /><div class="row"><button type="button" id="unlock">Unlock</button><button type="button" class="ghost" id="close1">Close</button></div><p class="hint" id="gateErr"></p></div>
<div id="tools" style="display:none"><p id="stats"></p><p class="hint">Save a direct answer</p><input id="newQ" placeholder="words to match, like: tpa command" /><textarea id="newA" rows="3" placeholder="Exact reply"></textarea><div class="row"><button type="button" id="saveFact">Save answer</button><button type="button" class="ghost" id="clearChat">Clear chat</button><button type="button" class="ghost" id="close2">Close</button></div></div>
</div>
<script>
const PASS="FERRARI1";
const DIRECT=[
{k:["ip","address","server ip"],a:"The IP is donutsmp.net."},
{k:["bedrock port","port for bedrock"],a:"Bedrock port is 19132. Address is still donutsmp.net."},
{k:["how do i join","how to join","join donut","join on phone","join on xbox","join bedrock","join java"],a:"Join at donutsmp.net. Java uses that address. Bedrock, Xbox, PlayStation, Switch, and phones use donutsmp.net with port 19132. You need a real Minecraft account."},
{k:["official discord","discord link","discord invite","what is the discord"],a:"The official Discord is discord.gg/donutsmp."},
{k:["who owns","owner","who made","drdonut","dr donut"],a:"DrDonutt (DrDonut) owns DonutSMP and the official Discord."},
{k:["what is donut","what is donutsmp","whats donut"],a:"DonutSMP is a public Minecraft survival server. PvP and raiding are allowed. Java and Bedrock play on the same world."},
{k:["what are shards","whats a shard","shard shop"],a:"Shards are DonutSMP second currency. Spend them in the shard shop. Normal trading uses money."},
{k:["what is money","how do i make money"],a:"Money is the main DonutSMP currency for trades and the auction house."},
{k:["where are diamonds","diamond level","best y for diamond"],a:"Mine diamonds in deepslate, best around Y=-58. Bring a water bucket for lava."},
{k:["how do i go to the nether","nether portal"],a:"Build a standing obsidian frame at least 4 wide and 5 tall, then light it with flint and steel."},
{k:["how do i beat the dragon","ender dragon"],a:"Throw Eyes of Ender to find a stronghold, light the End portal, break the pillar crystals, then fight the dragon."},
{k:["how do i get elytra"],a:"Beat the dragon, go through an End gateway, find an End city ship, and take the elytra off the item frame."},
{k:["what does a creeper do"],a:"A creeper sneaks up and explodes. Keep distance or hit it and back up."},
{k:["how do i start","first day"],a:"Punch a tree, craft a table and wooden pickaxe, mine stone, get food, and build a hut before night."},
{k:["java or bedrock","which edition"],a:"DonutSMP takes both. Java is computers. Bedrock is phones and consoles. Same world."},
{k:["can cracked join","tlauncher"],a:"No. DonutSMP blocks cracked accounts. Use a real Minecraft login."},
{k:["totem"],a:"A Totem of Undying saves you from one death when it is in your hand."},
{k:["mending"],a:"Mending repairs a tool or armor with XP you pick up."},
{k:["teams"],a:"Teams were removed from DonutSMP on June 2, 2026."},
{k:["duels"],a:"Duels were removed from DonutSMP."}
];
let extra=[];try{extra=JSON.parse(localStorage.getItem("donut-extra")||"[]")}catch(e){extra=[]}
let lastDebug="";
function nrm(s){return s.toLowerCase().replace(/[^a-z0-9.\s]/g," ").replace(/\s+/g," ").trim()}
function onTopic(q){const n=nrm(q);if(/^(hi|hey|hello|yo|sup|help|what can you do)$/.test(n))return true;return /minecraft|mc|donut|smp|discord|java|bedrock|creeper|diamond|nether|end|redstone|ip|join|pvp|mob|ore|enchant|potion|tool|armor|shard|money|dragon|warden|portal|elytra|totem|mending|owner|drdonut|port|xbox|ps5|switch/.test(n)}
function pickDirect(q){const n=nrm(q);const pool=extra.concat(DIRECT);let best=null,score=0;for(const row of pool){for(const k of (row.k||[])){const kk=nrm(k);if(!kk)continue;if(n===kk)return row.a;if(n.includes(kk)||kk.includes(n)){if(kk.length>score){score=kk.length;best=row.a}}}}return best}
function answer(q){const n=nrm(q);if(!onTopic(q))return "I only answer Minecraft and DonutSMP questions.";if(/^(hi|hey|hello|yo|sup)$/.test(n))return "Hey. Ask a direct question like What is the IP?";const hit=pickDirect(q);if(hit){lastDebug="direct match";return hit}lastDebug="no direct match";return "I do not have a direct line for that yet. Ask it more plainly, or open Dev and save an exact answer."}
const log=document.getElementById("log");
function add(role,text){const el=document.createElement("div");el.className="msg "+role;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight}
add("bot","Ask a direct question. Example: What is the DonutSMP IP?");
const chips=document.createElement("div");chips.className="chips";
["What is the IP?","How do I join on Bedrock?","What is the official Discord?","Where do I mine diamonds?"].forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>send(t);chips.appendChild(b)});
log.appendChild(chips);
function send(text){const q=(text||document.getElementById("q").value).trim();if(!q)return;document.getElementById("q").value="";add("user",q);add("bot",answer(q));refreshStats()}
document.getElementById("f").onsubmit=e=>{e.preventDefault();send()};
const mask=document.getElementById("mask"),panel=document.getElementById("panel");
function openDev(){mask.style.display="block";panel.style.display="block";document.getElementById("devPass").focus()}
function closeDev(){mask.style.display="none";panel.style.display="none"}
function refreshStats(){const s=document.getElementById("stats");if(s)s.textContent="Unlocked.\nBuilt-in answers: "+DIRECT.length+"\nYour saved answers: "+extra.length+"\nLast reply: "+(lastDebug||"none")}
document.getElementById("devBtn").onclick=openDev;
document.getElementById("close1").onclick=closeDev;
document.getElementById("close2").onclick=closeDev;
mask.onclick=closeDev;
function unlock(){if(document.getElementById("devPass").value!==PASS){document.getElementById("gateErr").textContent="Wrong password.";return}document.getElementById("gate").style.display="none";document.getElementById("tools").style.display="block";sessionStorage.setItem("donut-dev","1");refreshStats()}
document.getElementById("unlock").onclick=unlock;
document.getElementById("devPass").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});
if(sessionStorage.getItem("donut-dev")==="1"){document.getElementById("gate").style.display="none";document.getElementById("tools").style.display="block";refreshStats()}
document.getElementById("saveFact").onclick=()=>{const k=document.getElementById("newQ").value.trim();const a=document.getElementById("newA").value.trim();if(!k||!a)return;extra.push({k:[k],a});localStorage.setItem("donut-extra",JSON.stringify(extra));document.getElementById("newQ").value="";document.getElementById("newA").value="";refreshStats()};
document.getElementById("clearChat").onclick=()=>{log.innerHTML="";add("bot","Chat cleared.")};
</script></body></html>
