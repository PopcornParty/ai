<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Donut Chat</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--line:#ddd4c5;--ink:#1c1914;--soft:#5c564c;--accent:#b56a16;--user:#efe4cf}
@media(prefers-color-scheme:dark){:root{--bg:#111214;--card:#1b1d22;--line:#2c3038;--ink:#f4efe6;--soft:#a8a194;--accent:#e0a24a;--user:#2a2418}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header b{color:var(--accent)}header button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
#log{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 12px;max-width:92%;white-space:pre-wrap;padding:10px 12px}
.msg.user{margin-left:auto;background:var(--user);border-radius:16px 16px 4px 16px}
.msg.bot{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit}
form button{border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;padding:0 16px}
.hint{color:var(--soft);font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font-size:13px}
#mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
#panel{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);z-index:21;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
#panel input{width:100%;margin:6px 0 10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
#panel .row{display:flex;gap:8px;flex-wrap:wrap}
#panel button{border:0;border-radius:12px;padding:10px 12px;background:var(--ink);color:var(--bg);font-weight:700}
#panel button.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
</style></head>
<body>
<div class="app">
<header><div><b>Donut Chat</b><div class="hint">Minecraft and DonutSMP</div></div><button type="button" id="devBtn">Dev</button></header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="Message"></textarea><button type="submit">Send</button></form>
</div>
<div id="mask"></div>
<div id="panel">
<h2>Dev panel</h2>
<div id="gate"><input id="devPass" type="password" placeholder="Password" /><div class="row"><button type="button" id="unlock">Unlock</button><button type="button" class="ghost" id="close1">Close</button></div><p class="hint" id="gateErr"></p></div>
<div id="tools" style="display:none"><p class="hint">Chat works with no key.</p><div class="row"><button type="button" class="ghost" id="clearChat">Clear chat</button><button type="button" class="ghost" id="close2">Close</button></div></div>
</div>
<script>
const PASS="FERRARI1";
const last={topic:"general",q:""};
const KB=[
{keys:["join","how do i play","get on","connect","add server"],lines:["Add the server as donutsmp.net. On Java that is enough. On Bedrock, Xbox, PlayStation, Switch, or phone, use the same address and set the port to 19132. You need a real Minecraft account.","To get on Donut: Multiplayer, add server, donutsmp.net. Bedrock players also type port 19132. Cracked launchers will not work."]},
{keys:["ip","address","server ip","whats the ip"],lines:["The IP is donutsmp.net.","Use donutsmp.net. That is the official address."]},
{keys:["port","bedrock port","xbox","playstation","ps5","switch","phone","mobile"],lines:["Bedrock and consoles use donutsmp.net with port 19132. Java can just use the address.","If you are not on Java, the port is 19132."]},
{keys:["discord","invite","ticket","appeal"],lines:["The official Discord is discord.gg/donutsmp. That is the one for news, tickets, and chat. Other Donut Discords are fan servers unless official staff links them.","Use discord.gg/donutsmp. Do not trust random staff invites in DMs."]},
{keys:["what is donut","whats donut","donutsmp","about the server"],lines:["DonutSMP is a public Minecraft survival server owned by DrDonutt. Java and Bedrock share the same world. PvP and raiding are part of the mode. The economy uses money plus shards.","It is a huge crossplay SMP. You grind, sell stuff, and fight. It is not a peaceful claims server."]},
{keys:["owner","who made","who owns","drdonut","dr donut"],lines:["DrDonutt owns DonutSMP and the official Discord.","The owner is DrDonutt."]},
{keys:["money","coins","make money","auction","ah","sell"],lines:["Money is the main Donut currency. You earn it by selling loot, spawners, and auction listings.","Sell extras and use the auction house for money."]},
{keys:["shard","shards","shard shop"],lines:["Shards are the second currency. They buy extra items in the shard shop. Everyday trades usually use money.","Shards are premium tokens. Money is everyday cash."]},
{keys:["first day","how do i start","beginner","new to minecraft"],lines:["Punch a tree, make a crafting table and wooden pickaxe, upgrade to stone, get food, and build a hut before night.","Wood first, then stone tools, then shelter and food."]},
{keys:["diamond","diamonds","where do i mine"],lines:["Diamonds are common in deepslate around Y=-58. Take a water bucket.","Go near Y=-58 and keep water on the hotbar."]},
{keys:["nether","portal","blaze"],lines:["Build a standing obsidian frame at least 4 wide and 5 tall, then light it with flint and steel. Beds explode in the Nether.","Nether portal is 4 by 5 obsidian, then light it."]},
{keys:["end","dragon","stronghold"],lines:["Eyes of Ender lead to a stronghold. Light the portal, break the pillar crystals, then fight the dragon.","Crystals first, dragon second."]},
{keys:["elytra"],lines:["Beat the dragon, go through an End gateway, find an End city ship, and take the elytra.","Elytra come from End city ships, not from the dragon itself."]},
{keys:["creeper"],lines:["A creeper sneaks up and explodes. Hit it and back off, or use a shield.","Creepers blow holes in bases. Keep distance."]},
{keys:["warden","deep dark"],lines:["The Warden lives in the deep dark. Sneak, use wool, and do not set off shriekers.","If you hear the Warden, sneak out."]},
{keys:["enchant","mending"],lines:["An enchanting table with 15 bookshelves gives level 30 options. Mending repairs gear with XP you pick up.","15 bookshelves around the table, then combine books on an anvil."]},
{keys:["totem"],lines:["Hold a Totem of Undying in your hand and it saves you from one death.","The totem only works if it is in your hand."]},
{keys:["pvp","raid"],lines:["Donut is open-world PvP. Stash extras and do not walk spawn in your only good kit.","Expect fights and raids. Hide backups."]},
{keys:["team","teams"],lines:["Teams were removed from DonutSMP on June 2, 2026."]},
{keys:["duel","duels"],lines:["Duels were removed from DonutSMP."]},
{keys:["cracked","tlauncher"],lines:["No. DonutSMP blocks cracked accounts. You need a real Minecraft login."]},
{keys:["java","bedrock","crossplay"],lines:["Donut is crossplay. Java is computers. Bedrock is phones and consoles. Bedrock uses port 19132.","Both editions can play on donutsmp.net."]},
{keys:["scam","fake staff"],lines:["Fake staff and free-rank DMs are scams. Never send a login code or real money.","If someone DMs you as staff and asks you to join another server, ignore it."]}
];
function nrm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9. ]/g," ").replace(/ +/g," ").trim()}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function scoreItem(item,n){let s=0;for(const k of item.keys){if(n===k)s+=12;else if(n.includes(k))s+=3+Math.min(k.length,8)}return s}
function onTopic(n){if(/^(hi|hey|hello|yo|sup|thanks|thank you|ok|okay|cool)$/.test(n))return true;if(/minecraft|donut|smp|discord|server/.test(n))return true;return KB.some(item=>scoreItem(item,n)>0)}
function followup(n){if(/^(what about|and|also|how|why)\b/.test(n)||n.split(" ").length<=4)return (last.q+" "+n).trim();return n}
function answer(raw){
  let n=nrm(raw);
  if(/^(hi|hey|hello|yo|sup)$/.test(n)){return pick(["Hey. Ask about joining Donut, the Discord, money, or any Minecraft thing you are stuck on.","Hi. What do you want to know?"])}
  if(/^(thanks|thank you|ok|okay|cool)$/.test(n))return pick(["Anytime.","Yep.","Ask another if you want."]);
  n=nrm(followup(n));
  if(!onTopic(n)&&!onTopic(nrm(raw)))return pick(["I only talk Minecraft and DonutSMP.","That is outside what I cover. Try a Donut or Minecraft question."]);
  let best=null,bestScore=0;
  for(const item of KB){const s=scoreItem(item,n);if(s>bestScore){bestScore=s;best=item}}
  if(!best||bestScore<3)return pick(["I did not catch the exact thing. Are you asking how to join, Discord, money, shards, or a Minecraft mechanic?","Say it more plainly. Example: How do I join on Xbox?"]);
  last.q=best.keys[0];
  return pick(best.lines);
}
const log=document.getElementById("log");
function add(role,text){const el=document.createElement("div");el.className="msg "+role;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight}
add("bot","Ask anything about Minecraft or DonutSMP.");
const chips=document.createElement("div");chips.className="chips";
["How do I join?","What is the Discord?","How do shards work?","Where are diamonds?"].forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>send(t);chips.appendChild(b)});
log.appendChild(chips);
function send(text){const q=(text||document.getElementById("q").value).trim();if(!q)return;document.getElementById("q").value="";add("user",q);add("bot",answer(q))}
document.getElementById("f").onsubmit=e=>{e.preventDefault();send()};
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
const mask=document.getElementById("mask"),panel=document.getElementById("panel");
function openDev(){mask.style.display="block";panel.style.display="block"}
function closeDev(){mask.style.display="none";panel.style.display="none"}
document.getElementById("devBtn").onclick=openDev;
document.getElementById("close1").onclick=closeDev;
document.getElementById("close2").onclick=closeDev;
mask.onclick=closeDev;
document.getElementById("unlock").onclick=()=>{if(document.getElementById("devPass").value!==PASS){document.getElementById("gateErr").textContent="Wrong password.";return}document.getElementById("gate").style.display="none";document.getElementById("tools").style.display="block"};
document.getElementById("devPass").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("unlock").click()});
document.getElementById("clearChat").onclick=()=>{log.innerHTML="";add("bot","Chat cleared.")};
</script></body></html>
