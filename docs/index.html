<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Donut Chat</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--line:#ddd4c5;--ink:#1c1914;--soft:#5c564c;--user:#efe4cf}
@media(prefers-color-scheme:dark){:root{--bg:#111214;--card:#1b1d22;--line:#2c3038;--ink:#f4efe6;--soft:#a8a194;--user:#2a2418}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#log{flex:1;overflow:auto;padding:16px}
.msg{margin:0 0 12px;max-width:94%;padding:10px 12px;white-space:pre-wrap}
.user{margin-left:auto;background:var(--user);border-radius:16px 16px 4px 16px}
.bot{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
form{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;resize:none}
form button{border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;padding:0 14px}
.hint{color:var(--soft);font-size:13px}header button{background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:6px 10px}
#mask{display:none;position:fixed;inset:0;background:#0006;z-index:20}
#panel{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);z-index:21;padding:16px;border-radius:18px 18px 0 0}
#panel input{width:100%;padding:10px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
</style></head>
<body>
<div class="app">
<header><div><b>Donut Chat</b><div class="hint">Minecraft + DonutSMP</div></div><button type="button" id="devBtn">Dev</button></header>
<div id="log"></div>
<form id="f"><textarea id="q" placeholder="Message"></textarea><button>Send</button></form>
</div>
<div id="mask"></div>
<div id="panel"><p>Password</p><input id="devPass" type="password" /><button type="button" id="unlock">Unlock</button> <button type="button" id="close1">Close</button><p id="err" class="hint"></p><div id="tools" style="display:none"><button type="button" id="clearChat">Clear chat</button> <button type="button" id="close2">Close</button></div></div>
<script>
const PASS="FERRARI1";
function n(s){return String(s||"").toLowerCase()}
function add(role,text){const el=document.createElement("div");el.className="msg "+role;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight}
const log=document.getElementById("log");
function talk(raw){
  const q=n(raw);
  if(/^(hi|hey|hello|yo|sup)!?$/.test(q.trim())) return "Hey. Ask a Minecraft or Donut question.";
  if(/blue axolotl|axolotl/.test(q) && /rare|rarity|chance|odds|how common|percent/.test(q))
    return "A blue axolotl is the rarest color. It does not spawn in the wild. When two axolotls breed, the baby is blue 1 time in 1200. Parent colors do not change that chance.";
  if(/axolotl/.test(q) && /color|type|kind|variant/.test(q))
    return "Axolotl colors are lucy (pink), wild (brown), gold, cyan, and blue. Blue is the rare one at 1 in 1200 from breeding.";
  if(/axolotl/.test(q))
    return "Axolotls live in water in lush caves. Pick them up with a bucket. Feed them buckets of tropical fish to breed. Blue babies are 1 in 1200.";
  if(/elytra/.test(q) && /ah|auction|cost|price|how much/.test(q))
    return "On Donut AH, elytra have been around 450M to 480M lately, with the last month about 210M to 490M. Check /ah search elytra for the live listing.";
  if(/elytra/.test(q))
    return "Elytra come from End city ships after you beat the dragon. On Donut a lot of people just buy one on /ah.";
  if(/discord/.test(q)) return "Official Discord is discord.gg/donutsmp.";
  if(/bedrock|xbox|ps5|switch|phone|port/.test(q) && /join|ip|donut|port/.test(q)) return "Bedrock and consoles: donutsmp.net port 19132.";
  if(/\bip\b|address/.test(q)) return "The IP is donutsmp.net.";
  if(/join/.test(q)) return "Add donutsmp.net. Java is just that address. Bedrock uses port 19132. Real account only.";
  if(/shard/.test(q)) return "Shards are Donut extra currency for the shard shop. Everyday trades use money.";
  if(/diamond/.test(q) && /where|y |level|mine/.test(q)) return "Diamonds are common around Y=-58 in deepslate. Take water.";
  if(/nether portal|go to the nether/.test(q)) return "Build a 4 by 5 obsidian frame and light it with flint and steel.";
  if(/warden/.test(q)) return "The Warden has 500 health and lives in the deep dark. Sneak, use wool, leave if it wakes.";
  if(/creeper/.test(q)) return "A creeper has 20 health and explodes if it reaches you. Hit and back up, or use a shield.";
  if(/mending/.test(q)) return "Mending repairs the item with XP you pick up. Librarians can sell the book.";
  if(/totem/.test(q)) return "Hold a Totem of Undying in your hand to survive one death. Evokers drop them.";
  if(/owner|drdonut/.test(q)) return "DrDonutt owns DonutSMP.";
  if(/pink sheep/.test(q) && /rare/.test(q)) return "Natural pink sheep are about 0.164 percent of sheep.";
  if(/charged creeper/.test(q)) return "A charged creeper only happens when lightning hits a creeper.";
  if(/minecraft|donut|smp|mob|ore|enchant|potion|biome|nether|end |end$|pvp|raid/.test(q))
    return "Ask it a bit more plainly. I can do rarity, how to get something, join info, or AH price.";
  return "That looks off-topic. I answer Minecraft and DonutSMP questions, including mobs like axolotls.";
}
add("bot","Ask a normal question. Try: how rare is a blue axolotl?");
function send(){const q=document.getElementById("q").value.trim();if(!q)return;document.getElementById("q").value="";add("user",q);add("bot",talk(q))}
document.getElementById("f").onsubmit=e=>{e.preventDefault();send()};
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
const mask=document.getElementById("mask"),panel=document.getElementById("panel");
document.getElementById("devBtn").onclick=()=>{mask.style.display="block";panel.style.display="block"};
function close(){mask.style.display="none";panel.style.display="none"}
document.getElementById("close1").onclick=close;document.getElementById("close2").onclick=close;mask.onclick=close;
document.getElementById("unlock").onclick=()=>{if(document.getElementById("devPass").value!==PASS){document.getElementById("err").textContent="Wrong password.";return}document.getElementById("tools").style.display="block"};
document.getElementById("clearChat").onclick=()=>{log.innerHTML="";add("bot","Chat cleared.")};
</script></body></html>
