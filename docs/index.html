<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Donut Chat</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--line:#ddd4c5;--ink:#1c1914;--soft:#5c564c;--user:#efe4cf}
@media(prefers-color-scheme:dark){:root{--bg:#111214;--card:#1b1d22;--line:#2c3038;--ink:#f4efe6;--soft:#a8a194;--user:#2a2418}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column}
header{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
header b{font-size:17px}
#log{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
.msg{margin:0 0 12px;max-width:94%;white-space:pre-wrap;padding:10px 12px}
.user{margin-left:auto;background:var(--user);border-radius:16px 16px 4px 16px}
.bot{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;resize:none;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit}
form button{border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;padding:0 14px}
.hint{color:var(--soft);font-size:13px}
header .row{display:flex;justify-content:space-between;align-items:center}
header button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink)}
#mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
#panel{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);z-index:21;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
#panel input{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:8px 0}
#panel button{border:0;border-radius:12px;padding:10px 12px;margin-right:8px}
</style></head>
<body>
<div class="app">
<header><div class="row"><div><b>Donut Chat</b><div class="hint">Ask normally. I answer the question you typed.</div></div><button type="button" id="devBtn">Dev</button></div></header>
<div id="log"></div>
<form id="f"><textarea id="q" rows="1" placeholder="Message"></textarea><button>Send</button></form>
</div>
<div id="mask"></div>
<div id="panel">
<p>Password</p>
<input id="devPass" type="password" />
<button type="button" id="unlock">Unlock</button>
<button type="button" id="close1">Close</button>
<p id="gateErr" class="hint"></p>
<div id="tools" style="display:none">
<p class="hint">Works with no key.</p>
<button type="button" id="clearChat">Clear chat</button>
<button type="button" id="close2">Close</button>
</div>
</div>
<script>
const PASS="FERRARI1";
const prev={item:"",intent:""};
function n(s){return String(s||"").toLowerCase().replace(/[^a-z0-9. $]/g," ").replace(/ +/g," ").trim()}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function greet(q){return /^(hi|hey|hello|yo|sup|hiya)\b/.test(q)}
function stripHi(q){return q.replace(/^(hi|hey|hello|yo|sup|hiya)[,!. ]+/,"")}
function itemOf(q){
  if(/elytra|elytras|wings/.test(q))return "elytra";
  if(/totem/.test(q))return "totem";
  if(/diamond/.test(q))return "diamond";
  if(/shard/.test(q))return "shard";
  if(/money|coin|balance/.test(q))return "money";
  return prev.item||"";
}
function intentOf(q){
  if(/how much|cost|price|worth|ah|auction|sell for|going for/.test(q))return "price";
  if(/how (do|can|to)|how do i/.test(q))return "how";
  if(/where/.test(q))return "where";
  if(/what is|whats|who/.test(q))return "what";
  if(/join|ip|port|bedrock|java|xbox|ps5|switch|phone/.test(q))return "join";
  if(/discord/.test(q))return "discord";
  if(prev.intent && q.split(" ").length<=4)return prev.intent;
  return "chat";
}
function talkPrice(item){
  if(item==="elytra")return pick([
    "On Donut AH, elytra have been going for about 450M-480M each recently. Over the last month listings have ranged from around 210M to about 490M. That is in-game money and it moves. Type /ah search elytra and look at the cheapest listing right now.",
    "Short answer: an elytra on /ah is usually a few hundred million. Public trackers had them near the mid-400 millions. Check /ah search elytra before you buy because someone can undercut in the next minute."
  ]);
  if(item==="totem")return "Totem AH prices jump after fights. I will not invent a number. In game: /ah search totem.";
  if(item==="diamond")return "AH diamond prices change too fast to treat like a fixed shop. For gathering them yourself, mine around Y=-58.";
  if(item)return "I do not have a live listing for that. Open /ah and search the item name.";
  return "Which item? If you mean elytra on /ah, those have been in the mid-hundreds of millions lately. Search /ah to see the live number.";
}
function talkJoin(q){
  if(/bedrock|xbox|ps5|playstation|switch|phone|mobile|port/.test(q))return "Bedrock and consoles join donutsmp.net with port 19132.";
  if(/ip|address/.test(q)) return "The IP is donutsmp.net.";
  return "Add donutsmp.net. Java can stop there. Bedrock, Xbox, PlayStation, Switch, and phones use port 19132. Real Minecraft account only.";
}
function talk(raw){
  let q=n(raw);
  const hi=greet(q);
  q=n(stripHi(q));
  if(!q)return pick(["Hey. What do you want to know?","Hi. Ask about Donut or Minecraft."]);
  if(/^(thanks|thank you|ok|okay|cool)$/.test(q)) return pick(["Anytime.","Yep."]);
  const item=itemOf(q);
  const intent=intentOf(q);
  prev.item=item||prev.item;
  prev.intent=intent;
  if(!/minecraft|mc|donut|smp|elytra|totem|diamond|nether|end|discord|ah|auction|ip|join|pvp|shard|money|creeper|warden|enchant|dragon|portal|bedrock|java|xbox/.test(q) && intent==="chat")
    return "I only do Minecraft and DonutSMP. Ask that.";
  let body="";
  if(intent==="price") body=talkPrice(item);
  else if(intent==="join") body=talkJoin(q);
  else if(intent==="discord") body="Official Discord is discord.gg/donutsmp.";
  else if(item==="elytra" && (intent==="how"||intent==="where"||intent==="what"))
    body="If you want one without paying AH prices, beat the dragon and loot an End city ship. On Donut it is usually faster to buy one on /ah.";
  else if(/owner|drdonut/.test(q)) body="DrDonutt owns DonutSMP.";
  else if(/shard/.test(q)) body="Shards are Donut extra currency for the shard shop. Normal player trades use money.";
  else if(/nether/.test(q)) body="Make a 4 by 5 obsidian frame and light it. Beds explode in the Nether.";
  else if(/dragon|end portal/.test(q)) body="Eyes of Ender find the stronghold. Break the crystals, then the dragon.";
  else if(/creeper/.test(q)) body="Creepers explode if they get close. Hit and back up, or use a shield.";
  else if(/mending|enchant/.test(q)) body="15 bookshelves around an enchanting table for level 30. Mending repairs the item with XP you pick up.";
  else if(/warden/.test(q)) body="Warden is in the deep dark. Sneak, use wool, leave if it wakes.";
  else if(/pvp|raid/.test(q)) body="Donut is open PvP. Stash extras. Do not walk spawn in your only kit.";
  else if(/what is donut|whats donut/.test(q)) body="DonutSMP is a huge crossplay survival server. PvP and raiding are allowed. Money and shards are the currencies.";
  else if(item==="elytra") body="Did you want the AH price, or how to get one from an End ship?";
  else body=pick(["Ask it in one clear question. Example: how much is an elytra on AH?","I need a bit more. Price, how to get it, or how to join?"]);
  if(hi) return pick(["Hey \u2014 ","Hi \u2014 "])+body;
  return body;
}
const log=document.getElementById("log");
function add(role,text){const el=document.createElement("div");el.className="msg "+role;el.textContent=text;log.appendChild(el);log.scrollTop=log.scrollHeight}
add("bot","Ask like you would ask a person. Example: how much is an elytra on AH?");
function send(text){
  const q=(text||document.getElementById("q").value).trim();
  if(!q)return;
  document.getElementById("q").value="";
  add("user",q);
  add("bot",talk(q));
}
document.getElementById("f").onsubmit=e=>{e.preventDefault();send()};
document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
const mask=document.getElementById("mask"),panel=document.getElementById("panel");
document.getElementById("devBtn").onclick=()=>{mask.style.display="block";panel.style.display="block"};
function close(){mask.style.display="none";panel.style.display="none"}
document.getElementById("close1").onclick=close;
document.getElementById("close2").onclick=close;
mask.onclick=close;
document.getElementById("unlock").onclick=()=>{
  if(document.getElementById("devPass").value!==PASS){document.getElementById("gateErr").textContent="Wrong password.";return}
  document.getElementById("tools").style.display="block";
};
document.getElementById("clearChat").onclick=()=>{log.innerHTML="";add("bot","Chat cleared.")};
</script></body></html>
